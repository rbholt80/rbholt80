android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configuration-cache=true
org.gradle.caching=true

# Kotlin comes from the JetBrains plugin rather than AGP's built-in support,
# which is what both modules apply. Deprecated in AGP 9 and removed in 10, so
# this is the flag to revisit when that lands.
android.builtInKotlin=false

android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
kotlin.code.style=official
