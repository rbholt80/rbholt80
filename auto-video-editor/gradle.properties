android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.configuration-cache=true
org.gradle.caching=true

# These two are load-bearing, not leftovers. Kotlin comes from the JetBrains
# plugin rather than AGP's built-in support, and org.jetbrains.kotlin.android
# 2.2.10 still reaches for AGP's legacy `BaseExtension`. With newDsl left at its
# AGP 9 default the extension is `ApplicationExtensionImpl` instead, and applying
# the plugin dies at configuration with:
#
#   Failed to apply plugin 'org.jetbrains.kotlin.android'
#   ClassCastException: ApplicationExtensionImpl cannot be cast to BaseExtension
#
# Both are deprecated and go away in AGP 10, so the migration is to drop the
# JetBrains plugin and move to AGP's built-in Kotlin — the two must move
# together, and neither can be removed on its own.
android.builtInKotlin=false
android.newDsl=false

android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
kotlin.code.style=official
