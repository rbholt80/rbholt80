# Desktop policy.
#
# Rules here load ABOVE the builtin defaults, and the first match wins, so
# anything in this file overrides the default for the same capability.
#
# Format:  <allow|confirm|deny>  <subject>  <capability>[:scope]   # reason
#
# Subjects are `user`, `system`, `agent:<id>`, `agent:*` or `*`.
# Run `nousctl policy` to see the defaults this sits on top of.

# The curator may file things inside your library folders without asking each
# time -- it only ever moves, never deletes, and the ledger can undo any of it.
allow    agent:curator   fs.move:~/Pictures/Screenshots/**
allow    agent:curator   fs.move:~/Music/**
allow    agent:curator   fs.move:~/Videos/**

# Examples, commented out. Uncomment what suits this machine.
#
# Keep everything on this machine, with no exceptions:
# deny   *               net.connect
#
# Let the system install packages without asking (not recommended):
# allow  user            pkg.install
#
# Lock a working directory so nothing may write to it at all:
# deny   *               fs.write:~/Archive/**
