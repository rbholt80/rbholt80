# NOUS OS configuration.
#
# Everything here has a working default; this file only records the choices this
# machine has made. `nousctl status` shows what is actually in effect.

[model]
# Backends are tried in order. `offline` stops the search: put it early to keep
# everything on this machine.
route = ollama,anthropic,openai,offline

# Routine work -- naming, sorting, classifying -- uses the small route, which is
# local-only by default. It is most of what the system does, and none of it
# needs to leave the machine or cost anything.
route.small = ollama,offline

timeout_secs = 60

[model.ollama]
url = http://127.0.0.1:11434
model = qwen2.5:7b-instruct
small_model = qwen2.5:1.5b-instruct

[model.anthropic]
model = claude-sonnet-5

[model.openai]
# Any OpenAI-compatible endpoint: OpenAI, OpenRouter, Groq, LM Studio,
# llama.cpp. Point it at whichever your key is good for.
url = https://api.openai.com/v1/chat/completions
model = gpt-4o-mini

[plan]
# Below this confidence the deterministic resolver hands over to a model.
grammar_threshold = 0.72
max_steps = 12

[index]
roots = ~/Documents,~/Downloads,~/Projects,~/Music,~/Videos,~/Pictures
exclude = node_modules,.git,target,__pycache__,.venv,dist,build
interval_secs = 900

[sensor]
interval_secs = 20
disk_alert_pct = 92
mem_alert_pct = 90

[ui]
port = 7666

[log]
level = info
