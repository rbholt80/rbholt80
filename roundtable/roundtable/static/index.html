<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roundtable</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6f6b64;
    --line: #e4e0d9;
    --accent: #1c1b19;
    --host: #2f2d2a;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --panel: #1e1d1a;
      --ink: #eceae5;
      --muted: #9a948a;
      --line: #302e2a;
      --accent: #eceae5;
      --host: #d8d4cc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel); display: flex; flex-wrap: wrap;
    gap: 10px 16px; align-items: baseline;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .roster { display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    background: none; font-family: inherit;
  }
  .chip:hover { border-color: var(--muted); color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  main {
    flex: 1; overflow-y: auto; padding: 24px 20px 8px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; }
  .turn { display: grid; grid-template-columns: 108px 1fr; gap: 16px; }
  .who {
    font-size: 13px; font-weight: 600; text-align: right;
    padding-top: 1px; word-break: break-word;
  }
  .what { white-space: pre-wrap; word-wrap: break-word; }
  .turn.host .what {
    border-left: 2px solid var(--host); padding-left: 12px; color: var(--host);
  }
  .turn.error .what { color: var(--muted); font-style: italic; }
  .claim-action { display: block; font-size: 11px; padding: 2px 6px; margin: 5px 0 0 auto; }
  .usage { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .usage table { width: 100%; border-collapse: collapse; text-align: right; }
  .usage th:first-child, .usage td:first-child { text-align: left; }
  .usage td, .usage th { padding: 3px 6px; }
  .cursor {
    display: inline-block; width: 7px; height: 1em; vertical-align: -2px;
    background: currentColor; opacity: .5; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 12px 20px 16px;
  }
  .bar { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px; min-height: 44px;
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--muted); outline-offset: -1px; }
  button {
    font: inherit; font-size: 13px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 11px 16px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  button.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  .hints { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }

  @media (max-width: 620px) {
    .turn { grid-template-columns: 1fr; gap: 4px; }
    .who { text-align: left; }
    .roster { margin-left: 0; }
    .bar { flex-wrap: wrap; }
    textarea { min-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1><span>Roundtable —</span> <b id="topic">connecting…</b></h1>
  <button id="new">New topic</button>
  <div class="roster" id="roster"></div>
</header>

<p class="hints" id="connections" style="padding: 0 20px"></p>
<main id="log"><div class="wrap" id="wrap">
  <p class="empty" id="empty">Press <b>Next</b> to open the discussion.</p>
</div></main>

<footer>
  <div class="bar">
    <textarea aria-label="Message to the table" id="input" rows="1" placeholder="Join the discussion… (@Name chooses the next speaker)"></textarea>
    <button id="send">Send</button>
    <button id="next" class="primary">Next ⏎</button>
    <button id="round">Run one round</button>
    <button id="opening" title="Every seat answers from the same starting transcript">Independent round</button>
    <button id="auto" disabled>Pause</button>
    <button id="save">Save</button>
  </div>
  <details class="usage"><summary id="cost-summary">Usage: no model turns yet</summary><div id="cost"></div></details>
  <p class="hints" id="hints">Enter sends · Shift+Enter for a new line · Cmd/Ctrl+Enter advances the table · Run one round gives every seat a turn</p>
</footer>

<script>
(async () => {
  const KEY = 'roundtable-token';
  const stash = value => { try { sessionStorage.setItem(KEY, value); } catch (e) {} };
  const recall = () => { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } };
  let token = location.hash.slice(1);
  if (token) stash(token); else token = recall();
  // Cookie fallback is established only with a valid fragment/header token.
  // Some embedded browsers discard sessionStorage during a page reload.
  const session = await fetch(token ? '/session' : '/state', token ? {
    method: 'POST', headers: {'Content-Type': 'application/json', 'X-Roundtable-Token': token},
    body: '{}'
  } : {}).catch(() => null);
  if (!session || !session.ok) {
    document.getElementById('topic').textContent = 'Reopen Roundtable from its launcher to connect';
    return;
  }
  if (location.hash) history.replaceState(null, '', location.pathname);

  const $ = id => document.getElementById(id);
  const wrap = $('wrap'), log = $('log'), input = $('input');
  const colors = new Map();
  const rendered = new Map();
  let live = null, liveSeq = -1, running = false;

  const post = (path, body = {}) => fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Roundtable-Token': token || '',
      'X-Roundtable-Client': 'browser' },
    body: JSON.stringify(body)
  }).then(response => response.json()).then(data => {
    if (data.error) $('hints').textContent = data.error;
    return data;
  }).catch(() => {
    $('hints').textContent = 'Could not reach Roundtable. Try again.';
    return {};
  });

  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const scroll = stick => { if (stick) log.scrollTop = log.scrollHeight; };
  const hasSeq = seq => Number.isInteger(seq) && seq >= 0;

  function updateControls() {
    const busy = running || live !== null;
    for (const id of ['next', 'round', 'opening', 'new']) $(id).disabled = busy;
    for (const chip of $('roster').children) chip.disabled = busy;
    $('auto').disabled = !running;
    $('auto').classList.toggle('on', running);
  }

  function challengeAction(what, speaker, text, seq) {
    if (speaker === 'Host' || !hasSeq(seq)) return;
    const who = what.parentElement.querySelector('.who');
    if (who.querySelector('.claim-action')) return;
    const action = document.createElement('button');
    action.className = 'claim-action';
    action.textContent = 'Challenge #' + seq;
    action.title = 'Ask for evidence about a specific claim in this reply';
    action.onclick = () => {
      const selected = window.getSelection()?.toString().trim();
      const quote = window.prompt('Quote the exact claim to challenge:',
        selected && text.includes(selected) ? selected : text);
      if (!quote || !quote.trim()) return;
      const question = window.prompt('What should the table examine?',
        'What evidence supports or weakens this claim?');
      if (question === null) return;
      post('/challenge', {seq, quote: quote.trim(), question: question.trim()});
    };
    who.append(action);
  }

  function addTurn(speaker, text, hex, isError, seq, completed = true) {
    if (hasSeq(seq) && rendered.has(seq)) return rendered.get(seq);
    $('empty')?.remove();
    const stick = atBottom();
    const row = document.createElement('div');
    row.className = 'turn' + (speaker === 'Host' ? ' host' : '') + (isError ? ' error' : '');
    const who = document.createElement('div');
    who.className = 'who';
    who.style.color = hex || colors.get(speaker) || 'inherit';
    who.textContent = speaker;
    const what = document.createElement('div');
    what.className = 'what';
    what.textContent = text || '';
    row.append(who, what);
    wrap.append(row);
    if (completed && hasSeq(seq)) rendered.set(seq, what);
    if (completed) challengeAction(what, speaker, text, seq);
    scroll(stick);
    return what;
  }

  function showLedger(ledger) {
    if (!ledger) return;
    const total = ledger.total;
    const estimated = total.estimated ? ' (includes estimated output)' : '';
    $('cost-summary').textContent = 'Usage: ' + total.turns + ' turns · ' +
      total.prompt_tokens.toLocaleString() + ' input / ' + total.output_tokens.toLocaleString() +
      ' output tokens · ' + total.seconds.toFixed(1) + 's' + estimated;
    const table = document.createElement('table');
    const head = document.createElement('tr');
    const dollars = Object.values(ledger.seats).some(row => row.dollars > 0);
    for (const label of ['Seat', 'Turns', 'Input', 'Output', 'Seconds', ...(dollars ? ['Cost'] : [])]) {
      const th = document.createElement('th'); th.textContent = label; head.append(th);
    }
    table.append(head);
    for (const [name, row] of Object.entries(ledger.seats)) {
      const tr = document.createElement('tr');
      const values = [name, row.turns, row.prompt_tokens.toLocaleString(),
        (row.estimated ? '~' : '') + row.output_tokens.toLocaleString(), row.seconds.toFixed(1)];
      if (dollars) values.push('$' + row.dollars.toFixed(4));
      for (const value of values) {
        const td = document.createElement('td'); td.textContent = value; tr.append(td);
      }
      table.append(tr);
    }
    $('cost').replaceChildren(table);
  }

  function cursor() {
    const caret = document.createElement('span');
    caret.className = 'cursor';
    return caret;
  }

  function handle(ev) {
    if (ev.type === 'snapshot') {
      $('topic').textContent = ev.topic;
      $('roster').replaceChildren();
      wrap.replaceChildren();
      colors.clear(); rendered.clear(); live = null; liveSeq = -1;
      $('connections').textContent = (ev.connections || []).map(x => x[0] + ': ' + x[1]).join(' · ');
      for (const p of ev.participants) {
        colors.set(p.name, p.hex);
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.title = 'Give ' + p.name + ' the floor — ' + p.model + ' · ' + (p.role || 'principal');
        const dot = document.createElement('span');
        dot.className = 'dot'; dot.style.background = p.hex; chip.append(dot);
        chip.append(p.name);
        chip.onclick = () => post('/next', { speaker: p.name });
        $('roster').append(chip);
      }
      const turns = ev.history.map(turn => ({...turn, type: 'turn'}));
      if (ev.active) turns.push({...ev.active, type: 'start'});
      turns.sort((a, b) => a.seq - b.seq);
      for (const turn of turns) handle(turn);
      if (!turns.length) {
        const p = document.createElement('p');
        p.className = 'empty'; p.id = 'empty';
        p.textContent = 'Choose Independent round for fresh answers, or Next to start the discussion.';
        wrap.append(p);
      }
      running = Boolean(ev.running ?? ev.auto);
      showLedger(ev.ledger);
      updateControls();
      log.scrollTop = log.scrollHeight;
    } else if (ev.type === 'turn') {
      addTurn(ev.speaker, ev.text, ev.hex, ev.error, ev.seq);
    } else if (ev.type === 'start') {
      if (rendered.has(ev.seq) || (live && liveSeq === ev.seq)) return;
      live = addTurn(ev.speaker, ev.text || '', ev.hex, false, ev.seq, false);
      liveSeq = ev.seq;
      live.append(cursor());
      updateControls();
    } else if (ev.type === 'chunk' && live && (ev.seq === undefined || ev.seq === liveSeq)) {
      const stick = atBottom();
      live.querySelector('.cursor')?.remove();
      live.append(document.createTextNode(ev.text), cursor());
      scroll(stick);
    } else if (ev.type === 'end') {
      const stick = atBottom();
      const what = live && liveSeq === ev.seq ? live :
        addTurn(ev.speaker, ev.text, ev.hex, ev.error, ev.seq);
      // The complete reply is authoritative, including a late error note.
      what.textContent = ev.text;
      what.parentElement.classList.toggle('error', Boolean(ev.error));
      if (hasSeq(ev.seq)) rendered.set(ev.seq, what);
      challengeAction(what, ev.speaker, ev.text, ev.seq);
      if (liveSeq === ev.seq) { live = null; liveSeq = -1; }
      showLedger(ev.ledger);
      updateControls();
      scroll(stick);
    } else if (ev.type === 'running' || ev.type === 'auto') {
      running = Boolean(ev.on);
      updateControls();
    }
  }

  const hintText = $('hints').textContent;
  const stream = new EventSource('/events' + (token ? '?t=' + encodeURIComponent(token) : ''));
  stream.onmessage = event => handle(JSON.parse(event.data));
  stream.onopen = () => { $('hints').textContent = hintText; };
  stream.onerror = () => { $('hints').textContent = 'Connection lost — reconnecting…'; };

  const send = async () => {
    const text = input.value.trim();
    if (!text) return;
    const result = await post('/say', {text});
    if (result.ok && input.value.trim() === text) { input.value = ''; input.style.height = 'auto'; }
  };
  $('new').onclick = () => {
    const topic = window.prompt('What should your AIs discuss?');
    if (topic && topic.trim()) post('/new', {topic: topic.trim()});
  };
  $('send').onclick = send;
  $('next').onclick = () => post('/next');
  $('round').onclick = () => post('/round');
  $('opening').onclick = () => post('/round', {independent: true});
  $('auto').onclick = () => post('/auto', {on: false});
  $('save').onclick = () => post('/save').then(result => {
    if (result.path) $('hints').textContent = 'Saved ' + result.path;
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
      event.preventDefault(); if (!$('next').disabled) post('/next');
    } else if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
  });
})();
</script>
</body>
</html>
