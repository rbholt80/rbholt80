[project]
name = "roundtable"
version = "0.1.0"
description = "Get every AI you have talking to each other."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Install only the seats you actually want at the table.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]        # also covers xAI, Groq, DeepSeek, Ollama, LM Studio
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]

[project.scripts]
roundtable = "roundtable.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roundtable*"]

[tool.setuptools.package-data]
roundtable = ["static/*.html"]
