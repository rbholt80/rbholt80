# Copy to roundtable.toml (here, or ~/.config/roundtable/) to pin the table.
# With no config file at all, Roundtable seats whatever it finds on the machine
# — run `roundtable doctor` to see that list.

[roundtable]
topic = "Is it worth learning to code in 2026?"
policy = "auto"            # auto | round_robin | random | weighted
moderate_every = 0         # let a moderator seat sum up every N turns (0 = never)
context_turns = 40         # transcript turns each model sees; bounds cost
transcripts = "."

# Every [[participant]] below is one seat. Delete the ones you don't have.
# `persona` is optional — it gives a model an angle, which makes for a better
# argument than three assistants agreeing with each other.

[[participant]]
name = "Claude"
kind = "anthropic"
model = "claude-opus-5"
api_key_env = "ANTHROPIC_API_KEY"
effort = "low"             # low keeps conversational turns quick and cheap
persona = "the one who wants the claim made precise before agreeing with it"

[[participant]]
name = "ChatGPT"
kind = "openai"
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"

[[participant]]
name = "Grok"
kind = "openai"
model = "grok-4"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
persona = "the contrarian; find the strongest objection nobody has made yet"

[[participant]]
name = "Gemini"
kind = "gemini"
model = "gemini-2.5-pro"
api_key_env = "GEMINI_API_KEY"

# Local models are discovered and seated automatically — one seat per
# chat-capable model, with small ones put on the panel. Write them out only to
# override that.
[[participant]]
name = "Llama"
kind = "openai"
model = "llama3.2:1b"
base_url = "http://localhost:11434/v1"
role = "panel"             # one concrete point per turn, not a speech
weight = 0.35              # and less of the floor than a principal
enabled = false

# A seat that keeps the others honest without taking a side.
[[participant]]
name = "Chair"
kind = "anthropic"
model = "claude-opus-5"
api_key_env = "ANTHROPIC_API_KEY"
role = "moderator"
enabled = false

# An installed CLI rather than an API. Note this runs a real agent on your
# machine with its own tool access — see the README before enabling.
[[participant]]
name = "Claude-CLI"
kind = "cli"
model = "claude"
argv = ["claude", "-p"]
enabled = false

# Costs nothing, answers instantly. Handy for checking the UI works.
[[participant]]
name = "Mock"
kind = "mock"
enabled = false
